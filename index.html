<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">

    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "ZTaqG0OwgQtgPECe-",
      });
   })();
</script>
</head>
<body>
    <main class="contact-page">
        <section class="contact-card" aria-labelledby="contact-title">
            <header class="contact-header">
                <p class="contact-eyebrow">Get in touch</p>
                <h1 id="contact-title">Contact Form</h1>
                <p class="contact-intro">Have a question or an idea? Send a message and I’ll be in touch.</p>
            </header>

            <form id="contact">
                <input type="hidden" id="subject" name="subject" value="contact form submission">

                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>

                <button type="button" class="btn" onclick="sendEmail()">Send message</button>
            </form>
        </section>
    </main>
<script type="text/javascript" src="script.js"></script>

</body>
</html>
